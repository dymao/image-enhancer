<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人简易版修图工具</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="left-panel">
        <div class="brand">
          <div class="logo">M</div>
          <div>
            <h1>个人简易版修图工具</h1>
            <p>本地高级修图工具</p>
          </div>
        </div>

        <label class="theme-switcher" for="themeModeSelect">
          <span>界面风格</span>
          <select id="themeModeSelect" aria-label="界面风格">
            <option value="system">跟随系统</option>
            <option value="dark">深色风格</option>
            <option value="light">白色风格</option>
          </select>
        </label>

        <button id="openButton" class="primary-action">打开图片</button>
        <button id="saveButton" class="secondary-action" disabled>导出成片</button>

        <section class="preset-section style-section">
          <button id="posterToggleButton" class="preset-card style-toggle poster-toggle" aria-expanded="false" aria-controls="posterOptions">
            <span>一键生成海报</span>
            <small>点击展开旅行、商品、节日、杂志等海报样式</small>
          </button>
          <div id="posterOptions" class="style-options collapsed">
            <button class="preset-card poster-travel" data-poster-layout="travel-memory">
              <span class="poster-thumb poster-thumb-travel" aria-hidden="true"></span>
              <span>旅行记忆海报</span>
              <small>大图融入明亮渐变背景，适合风景和旅拍</small>
            </button>
            <button class="preset-card poster-product" data-poster-layout="product-launch">
              <span class="poster-thumb poster-thumb-product" aria-hidden="true"></span>
              <span>新品发布海报</span>
              <small>居中商品相框、光晕衬托，适合商品展示</small>
            </button>
            <button class="preset-card poster-festival" data-poster-layout="festival-greeting">
              <span class="poster-thumb poster-thumb-festival" aria-hidden="true"></span>
              <span>节日祝福海报</span>
              <small>暖色氛围和柔和装饰，适合节日照片</small>
            </button>
            <button class="preset-card poster-magazine" data-poster-layout="magazine-cover">
              <span class="poster-thumb poster-thumb-magazine" aria-hidden="true"></span>
              <span>极简杂志封面</span>
              <small>留白标题和质感边框，适合人像写真</small>
            </button>
            <button class="preset-card poster-portrait" data-poster-layout="portrait-studio">
              <span class="poster-thumb poster-thumb-portrait" aria-hidden="true"></span>
              <span>人像写真海报</span>
              <small>柔粉背景和光影层次，适合自拍、写真、头像</small>
            </button>
            <button class="preset-card poster-food" data-poster-layout="food-promo">
              <span class="poster-thumb poster-thumb-food" aria-hidden="true"></span>
              <span>美食种草海报</span>
              <small>暖橙氛围和促销排版，适合餐饮美食分享</small>
            </button>
            <button class="preset-card poster-event" data-poster-layout="event-promo">
              <span class="poster-thumb poster-thumb-event" aria-hidden="true"></span>
              <span>活动宣传海报</span>
              <small>强对比动感排版，适合聚会、演出、活动预告</small>
            </button>
            <button class="preset-card poster-cinema" data-poster-layout="cinema-story">
              <span class="poster-thumb poster-thumb-cinema" aria-hidden="true"></span>
              <span>电影质感海报</span>
              <small>暗调大片氛围，适合街拍、人像和夜景照片</small>
            </button>
            <button class="preset-card poster-course" data-poster-layout="course-share">
              <span class="poster-thumb poster-thumb-course" aria-hidden="true"></span>
              <span>课程分享海报</span>
              <small>清爽蓝白布局，适合知识、课程、教程封面</small>
            </button>
            <button class="preset-card poster-recruit" data-poster-layout="recruit-poster">
              <span class="poster-thumb poster-thumb-recruit" aria-hidden="true"></span>
              <span>招聘宣传海报</span>
              <small>醒目标题和商务蓝紫色，适合招募与公告</small>
            </button>
          </div>
        </section>

        <section class="preset-section style-section">
          <button id="sceneToggleButton" class="preset-card style-toggle scene-toggle" aria-expanded="false" aria-controls="sceneOptions">
            <span>实用场景一键修图</span>
            <small>点击展开人像、婚纱、证件、商品、美食等场景处理</small>
          </button>
          <div id="sceneOptions" class="style-options collapsed">
            <button class="preset-card" data-preset="portrait">
              <span>人像一键美化</span>
              <small>自然美白、磨皮、轻微瘦脸</small>
            </button>
            <button class="preset-card wedding" data-preset="wedding">
              <span>婚纱照一键精修</span>
              <small>通透柔光、肤色干净、高光柔和</small>
            </button>
            <button class="preset-card old-photo" data-preset="oldPhoto">
              <span>老照片一键修复</span>
              <small>提亮去灰、降噪修复、增强清晰度</small>
            </button>
            <button class="preset-card id-photo" data-preset="idPhotoClean">
              <span>证件照净化</span>
              <small>肤色干净、亮度均衡、背景更清爽</small>
            </button>
            <button class="preset-card product" data-preset="productPolish">
              <span>商品图优化</span>
              <small>提高亮度、清晰度和商品质感</small>
            </button>
            <button class="preset-card food" data-preset="foodFresh">
              <span>美食增色</span>
              <small>色彩更鲜亮，提升食物诱人感</small>
            </button>
          </div>
        </section>

        <section class="preset-section style-section">
          <button id="qualityToggleButton" class="preset-card style-toggle quality-toggle" aria-expanded="false" aria-controls="qualityOptions">
            <span>画质增强一键修图</span>
            <small>点击展开清晰、降噪、通透等画质处理</small>
          </button>
          <div id="qualityOptions" class="style-options collapsed">
            <button class="preset-card clarity" data-preset="clarityBoost">
              <span>清晰增强</span>
              <small>增强锐度和细节，适合模糊照片</small>
            </button>
            <button class="preset-card denoise" data-preset="cleanDenoise">
              <span>降噪净化</span>
              <small>降低噪点、保留柔和质感</small>
            </button>
            <button class="preset-card bright" data-preset="transparentBright">
              <span>通透提亮</span>
              <small>画面更亮、更干净、更有空气感</small>
            </button>
          </div>
        </section>

        <section class="preset-section style-section">
          <button id="toneToggleButton" class="preset-card style-toggle tone-toggle" aria-expanded="false" aria-controls="toneOptions">
            <span>光影色彩一键修图</span>
            <small>点击展开暖调、冷调、高对比等影调</small>
          </button>
          <div id="toneOptions" class="style-options collapsed">
            <button class="preset-card warm" data-preset="warmLight">
              <span>暖调提亮</span>
              <small>暖色柔光，适合室内和日落照片</small>
            </button>
            <button class="preset-card cool" data-preset="coolClean">
              <span>冷调清透</span>
              <small>偏冷干净，适合建筑和雪景照片</small>
            </button>
            <button class="preset-card contrast" data-preset="dramaticContrast">
              <span>高对比大片</span>
              <small>增强明暗层次，适合氛围感照片</small>
            </button>
          </div>
        </section>

        <section class="preset-section style-section">
          <button id="repairToggleButton" class="preset-card style-toggle repair-toggle" aria-expanded="false" aria-controls="repairOptions">
            <span>环境修复一键修图</span>
            <small>点击展开逆光、室内偏黄、夜景噪点等修复</small>
          </button>
          <div id="repairOptions" class="style-options collapsed">
            <button class="preset-card backlight" data-preset="backlightRescue">
              <span>逆光补救</span>
              <small>提亮暗部、保留高光，适合逆光人像</small>
            </button>
            <button class="preset-card indoor" data-preset="indoorYellowFix">
              <span>室内偏黄修正</span>
              <small>降低黄感、提高清透度，适合室内灯光</small>
            </button>
            <button class="preset-card night-clean" data-preset="nightNoiseClean">
              <span>夜景降噪</span>
              <small>压低噪点、增强夜景层次和清晰度</small>
            </button>
          </div>
        </section>

        <section class="preset-section style-section">
          <button id="portraitDetailToggleButton" class="preset-card style-toggle portrait-detail-toggle" aria-expanded="false" aria-controls="portraitDetailOptions">
            <span>人像细修一键修图</span>
            <small>点击展开肤色、五官、柔焦等人像细节</small>
          </button>
          <div id="portraitDetailOptions" class="style-options collapsed">
            <button class="preset-card skin-clean" data-preset="skinToneClean">
              <span>肤色净透</span>
              <small>美白磨皮更自然，保留肤色层次</small>
            </button>
            <button class="preset-card face-detail" data-preset="faceDetailEnhance">
              <span>五官清晰</span>
              <small>增强锐度和对比，让面部细节更立体</small>
            </button>
            <button class="preset-card soft-portrait" data-preset="softPortraitGlow">
              <span>柔焦人像</span>
              <small>轻柔光、低噪点，适合写真和自拍</small>
            </button>
          </div>
        </section>

        <section class="preset-section style-section">
          <button id="socialToggleButton" class="preset-card style-toggle social-toggle" aria-expanded="false" aria-controls="socialOptions">
            <span>社交分享一键修图</span>
            <small>点击展开朋友圈、头像、旅行照片优化</small>
          </button>
          <div id="socialOptions" class="style-options collapsed">
            <button class="preset-card moments" data-preset="momentsBright">
              <span>朋友圈提亮</span>
              <small>整体更明亮通透，适合快速分享</small>
            </button>
            <button class="preset-card avatar" data-preset="avatarPop">
              <span>头像突出</span>
              <small>增强人物质感和清晰度，适合头像裁切</small>
            </button>
            <button class="preset-card travel" data-preset="travelVivid">
              <span>旅行鲜亮</span>
              <small>提升天空、建筑和风景色彩表现</small>
            </button>
          </div>
        </section>

        <section class="preset-section style-section">
          <button id="collageToggleButton" class="preset-card style-toggle collage-toggle" aria-expanded="false" aria-controls="collageOptions">
            <span>拼图一键排版</span>
            <small>点击展开双图、三图、多宫格、主次拼等拼接样式</small>
          </button>
          <div id="collageOptions" class="style-options collapsed">
            <button class="preset-card collage-two" data-collage-layout="two-vertical">
              <span class="collage-thumb" aria-hidden="true"></span>
              <span>两张竖拼</span>
              <small>上下拼接，适合对比和长图展示</small>
            </button>
            <button class="preset-card collage-two" data-collage-layout="two-horizontal">
              <span class="collage-thumb" aria-hidden="true"></span>
              <span>两张横拼</span>
              <small>左右拼接，适合横向对比</small>
            </button>
            <button class="preset-card collage-three" data-collage-layout="three-feature">
              <span class="collage-thumb" aria-hidden="true"></span>
              <span>三张主次拼</span>
              <small>一张大图配两张小图，适合故事感排版</small>
            </button>
            <button class="preset-card collage-three" data-collage-layout="three-vertical">
              <span class="collage-thumb" aria-hidden="true"></span>
              <span>三张竖排拼</span>
              <small>三张上下排列，适合长图对比</small>
            </button>
            <button class="preset-card collage-three" data-collage-layout="three-horizontal">
              <span class="collage-thumb" aria-hidden="true"></span>
              <span>三张横排拼</span>
              <small>三张左右排列，适合横向展示</small>
            </button>
            <button class="preset-card collage-three" data-collage-layout="three-side-feature">
              <span class="collage-thumb" aria-hidden="true"></span>
              <span>三张侧主图</span>
              <small>左侧大图、右侧双图，适合突出主体</small>
            </button>
            <button class="preset-card collage-grid" data-collage-layout="four-grid">
              <span class="collage-thumb" aria-hidden="true"></span>
              <span>四宫格拼图</span>
              <small>2 x 2 网格，适合日常合集</small>
            </button>
            <button class="preset-card collage-grid" data-collage-layout="four-vertical">
              <span class="collage-thumb" aria-hidden="true"></span>
              <span>四张竖排拼</span>
              <small>四张上下排列，适合步骤和对比</small>
            </button>
            <button class="preset-card collage-grid" data-collage-layout="four-horizontal">
              <span class="collage-thumb" aria-hidden="true"></span>
              <span>四张横排拼</span>
              <small>四张左右排列，适合宽屏展示</small>
            </button>
            <button class="preset-card collage-grid" data-collage-layout="four-feature">
              <span class="collage-thumb" aria-hidden="true"></span>
              <span>四张主次拼</span>
              <small>一张大图配三张小图，突出重点</small>
            </button>
            <button class="preset-card collage-grid" data-collage-layout="five-feature">
              <span class="collage-thumb" aria-hidden="true"></span>
              <span>五张主图拼</span>
              <small>上方大图、下方四图，适合合集封面</small>
            </button>
            <button class="preset-card collage-grid" data-collage-layout="five-grid">
              <span class="collage-thumb" aria-hidden="true"></span>
              <span>五张错落拼</span>
              <small>大小错落排列，适合生活记录</small>
            </button>
            <button class="preset-card collage-grid" data-collage-layout="six-grid">
              <span class="collage-thumb" aria-hidden="true"></span>
              <span>六宫格拼图</span>
              <small>2 x 3 网格，适合旅行和商品展示</small>
            </button>
            <button class="preset-card collage-grid" data-collage-layout="six-horizontal">
              <span class="collage-thumb" aria-hidden="true"></span>
              <span>六张横向拼</span>
              <small>3 x 2 横版网格，适合宽图合集</small>
            </button>
            <button class="preset-card collage-grid" data-collage-layout="six-feature">
              <span class="collage-thumb" aria-hidden="true"></span>
              <span>六张主次拼</span>
              <small>一张主图配五张小图，层次更丰富</small>
            </button>
            <button class="preset-card collage-grid" data-collage-layout="nine-grid">
              <span class="collage-thumb" aria-hidden="true"></span>
              <span>九宫格拼图</span>
              <small>最多 9 张图片，适合社交分享</small>
            </button>
            <button class="preset-card collage-grid" data-collage-layout="nine-vertical">
              <span class="collage-thumb" aria-hidden="true"></span>
              <span>九张竖版拼</span>
              <small>竖版九宫格，适合长图海报式分享</small>
            </button>
          </div>
        </section>

        <section class="preset-section style-section">
          <button id="styleToggleButton" class="preset-card style-toggle" aria-expanded="false" aria-controls="styleOptions">
            <span>风格化一键修图</span>
            <small>点击展开蓝天、青春、胶片、复古等风格</small>
          </button>
          <div id="styleOptions" class="style-options collapsed">
            <button class="preset-card sky" data-style-preset="blueSky">
              <span>蓝天白云</span>
              <small>天空更蓝、白云更干净、画面通透</small>
            </button>
            <button class="preset-card youth" data-style-preset="cyanYouth">
              <span>青色青春</span>
              <small>青绿色调、人物清爽、适合校园写真</small>
            </button>
            <button class="preset-card film" data-style-preset="warmFilm">
              <span>暖阳胶片</span>
              <small>暖色高光、轻胶片感、适合日落外景</small>
            </button>
            <button class="preset-card gray" data-style-preset="premiumGray">
              <span>高级灰</span>
              <small>低饱和、稳重影调、适合质感大片</small>
            </button>
            <button class="preset-card cherry" data-style-preset="sweetPink">
              <span>甜美樱花</span>
              <small>粉色高光、肤色柔和、适合少女写真</small>
            </button>
            <button class="preset-card night" data-style-preset="cyberNight">
              <span>赛博夜景</span>
              <small>蓝紫霓虹、高对比、适合城市夜拍</small>
            </button>
            <button class="preset-card forest" data-style-preset="forestFresh">
              <span>森林清新</span>
              <small>绿意清透、自然通风、适合户外草地</small>
            </button>
            <button class="preset-card vintage" data-style-preset="vintageRetro">
              <span>复古港风</span>
              <small>暖红暗部、复古对比、适合街拍人像</small>
            </button>
            <button class="preset-card bw" data-style-preset="classicBw">
              <span>经典黑白</span>
              <small>黑白层次、强对比、适合纪实肖像</small>
            </button>
          </div>
        </section>

        <div class="tip-card">
          <strong>提示</strong>
          <span>预览使用缩略图实时渲染，导出时会按原图尺寸重新处理。</span>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <span class="eyebrow">Preview</span>
            <h2 id="fileName">还没有打开图片</h2>
          </div>
          <div id="imageMeta" class="image-meta">
            <span>支持 JPG / PNG / WEBP / BMP</span>
          </div>
        </header>

        <section id="documentTabs" class="document-tabs" aria-label="已打开图片"></section>

        <section class="canvas-card">
          <div id="emptyState" class="empty-state" role="button" tabindex="0" aria-label="打开图片">
            <div class="empty-icon">+</div>
            <h3>打开一张图片开始修图</h3>
            <p>支持人像照、婚纱照、写真照和普通图片。</p>
          </div>
          <canvas id="previewCanvas"></canvas>
          <div id="textEditorFrame" class="text-editor-frame">
            <button id="textDragHandle" class="text-drag-handle" type="button" title="拖动文字位置" aria-label="拖动文字位置"></button>
            <button id="textDeleteButton" class="text-delete-button" type="button" title="删除文字框" aria-label="删除文字框">x</button>
            <div id="textContent" class="text-editor-overlay" contenteditable="true" role="textbox" aria-label="图片文字" data-placeholder="输入文字"></div>
          </div>
        </section>
      </main>

      <aside class="right-panel">
        <div class="panel-header">
          <span class="eyebrow">Tools</span>
          <h2>工具箱</h2>
        </div>

        <section class="tool-section">
          <div class="tool-dock" role="toolbar" aria-label="编辑工具">
            <button id="adjustToolButton" class="tool-icon adjust-icon" type="button" title="微调工具" aria-label="微调工具"></button>
            <button id="textToolButton" class="tool-icon" type="button" title="文字工具" aria-label="文字工具">T</button>
            <button id="mosaicToolButton" class="tool-icon mosaic-icon" type="button" title="马赛克工具" aria-label="马赛克工具"></button>
            <button id="historyToolButton" class="tool-icon history-icon" type="button" title="历史记录" aria-label="历史记录">H</button>
          </div>

          <div id="adjustToolPanel" class="tool-popover">
            <div class="panel-header compact inside-panel">
              <span class="eyebrow">Adjustments</span>
              <h2>微调</h2>
            </div>

            <div id="controls" class="controls"></div>

          </div>

          <div id="textToolPanel" class="tool-popover">
            <label class="field-control icon-field">
              <span title="样式预设">★</span>
              <select id="textPreset">
                <option value="custom">自定义</option>
                <option value="weddingTitle">婚纱标题</option>
                <option value="posterGlow">海报发光</option>
                <option value="simpleCaption">简洁字幕</option>
                <option value="stamp">印章标题</option>
              </select>
            </label>

            <label class="field-control icon-field">
              <span title="字体">F</span>
              <select id="textFont">
                <option value="PingFang SC, Microsoft YaHei, sans-serif">苹方 / 微软雅黑</option>
                <option value="Songti SC, SimSun, serif">宋体</option>
                <option value="Kaiti SC, KaiTi, serif">楷体</option>
                <option value="Arial, Helvetica, sans-serif">Arial</option>
                <option value="Georgia, serif">Georgia</option>
              </select>
            </label>

            <label class="field-control icon-field">
              <span title="文字效果">fx</span>
              <select id="textEffect">
                <option value="shadow">阴影</option>
                <option value="glow">发光</option>
                <option value="float">悬浮</option>
                <option value="outline">描边</option>
              </select>
            </label>

            <div class="control">
              <div class="control-head">
                <span title="文字大小">Aa</span>
                <span id="textSizeValue">48</span>
              </div>
              <input id="textSize" type="range" min="16" max="160" value="48" />
            </div>

            <label class="field-control inline-field">
              <span title="文字颜色">A</span>
              <input id="textColor" type="color" value="#ffffff" />
            </label>

            <div class="tool-grid">
              <label class="toggle-row compact-toggle">
                <input id="textBold" type="checkbox" />
                <span title="加粗">B</span>
              </label>
              <label class="toggle-row compact-toggle">
                <input id="textItalic" type="checkbox" />
                <span title="斜体"><i>I</i></span>
              </label>
            </div>

            <p class="tool-hint">选择 T 后，在图片中央虚线框内输入文字，可拖动移动。</p>
          </div>

          <div id="mosaicToolPanel" class="tool-popover">
            <label class="toggle-row">
              <input id="mosaicToggle" type="checkbox" />
              <span>启用马赛克</span>
            </label>

            <label class="field-control">
              <span>预设</span>
              <select id="mosaicPreset">
                <option value="custom">自定义</option>
                <option value="privacy">隐私遮挡</option>
                <option value="softBlur">柔和模糊</option>
                <option value="darkMask">深色遮罩</option>
                <option value="comicDots">波点图案</option>
              </select>
            </label>

            <div class="tool-grid">
              <label class="field-control">
                <span>形状</span>
                <select id="mosaicShape">
                  <option value="rect">矩形</option>
                  <option value="ellipse">椭圆</option>
                </select>
              </label>
              <label class="field-control">
                <span>样式</span>
                <select id="mosaicStyle">
                  <option value="pixelate">像素块</option>
                  <option value="blur">模糊</option>
                  <option value="solid">纯色遮罩</option>
                  <option value="pattern">图案遮罩</option>
                </select>
              </label>
            </div>

            <div class="control">
              <div class="control-head">
                <span>笔刷</span>
                <span id="mosaicSizeValue">18</span>
              </div>
              <input id="mosaicSize" type="range" min="6" max="60" value="18" />
            </div>

            <label class="field-control inline-field">
              <span>颜色</span>
              <input id="mosaicColor" type="color" value="#111827" />
            </label>

            <label class="field-control">
              <span>图案</span>
              <select id="mosaicPattern">
                <option value="grid">网格</option>
                <option value="dots">圆点</option>
                <option value="diagonal">斜线</option>
              </select>
            </label>

            <button id="clearMosaicRegion" class="secondary-action compact-action">清除区域</button>
            <p class="tool-hint">选择马赛克工具后，在图片上拖拽选定区域。</p>
          </div>

          <div id="historyToolPanel" class="tool-popover">
            <div class="panel-header compact inside-panel">
              <span class="eyebrow">History</span>
              <h2>历史记录</h2>
            </div>

            <button id="historyUndoButton" class="secondary-action compact-action" type="button">回退上一步</button>
            <div id="historyList" class="history-list" aria-live="polite"></div>
            <p class="tool-hint">记录当前图片的一键效果；删除某条记录会同步移除对应效果。</p>
          </div>
        </section>
      </aside>
    </div>

    <div id="toast" class="toast"></div>
    <script src="./renderer.js"></script>
  </body>
</html>
